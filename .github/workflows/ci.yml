name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit and filesystem acceptance tests
        run: swift test
      - name: Hidden synthetic UI smoke test
        run: |
          "$(swift build --show-bin-path)/FileTriage" --smoke-test
      - name: Release compile
        run: swift build -c release
      - name: Audit tracked files for private payloads
        run: python3 scripts/audit-source.py
      - name: Privacy audit regression fixtures
        run: python3 scripts/test-audit.py
