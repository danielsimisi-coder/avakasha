name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit and filesystem acceptance tests
        run: swift test
      - name: Hidden synthetic UI smoke test
        run: |
          "$(swift build --show-bin-path)/Keepelix" --smoke-test
      - name: Universal package and real bundled launch
        run: bash scripts/build-app.sh
      - name: Audit release payload
        run: python3 scripts/audit-release.py dist/Keepelix-0.1.0-beta.6-universal.zip
      - name: Audit tracked files for private payloads
        run: python3 scripts/audit-source.py
      - name: Privacy audit regression fixtures
        run: python3 scripts/test-audit.py
